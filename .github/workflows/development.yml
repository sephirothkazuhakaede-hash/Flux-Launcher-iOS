name: Development build

# CI refresh for LWJGL 3.4.1 test build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened, synchronize]
    paths-ignore: &docs
      - '**.md'
      - 'LICENSE'
      - 'donate.png'
  push:
    branches-ignore:
      - 'l10n_main'
    paths-ignore: *docs
  workflow_dispatch:

# Concurrency control: a new push to the same branch/PR cancels older builds that are still queued or running.
# This markedly reduces the "stuck in the queue forever" problem caused by macos-14 runner scarcity:
# during frequent development pushes the old builds are cancelled immediately and the runner capacity goes to the newest commit.
# Manual workflow_dispatch runs join the same group, so automatic and manual triggers do not pile up on each other.
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-14

    steps:
      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version || true

      - name: Install GNU Make
        run: |
          brew update
          brew install make

      - name: Install Java 8 (Temurin) via Homebrew
        run: |
          brew install --cask temurin@8 || true

      - name: Install ldid
        run: |
          brew install ldid || true

      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove stale MobileGL gitlink
        # The MobileGL submodule has been removed completely (there is no matching entry in .gitmodules),
        # but parallel agent operations or a stale local index can reintroduce an orphaned gitlink,
        # making a later git submodule update --init exit 128 because it cannot find the URL.
        # It is therefore force-cleaned after checkout and before submodule initialization.
        # The MobileGlues submodule has likewise been removed (its source is embedded in the repository directly, aligned with Ynnyny).
        run: |
          git rm --cached -f Natives/external/MobileGL 2>/dev/null || true
          git config --remove-section submodule.Natives/external/MobileGL 2>/dev/null || true
          git rm --cached -f Natives/external/MobileGlues 2>/dev/null || true
          git config --remove-section submodule.Natives/external/MobileGlues 2>/dev/null || true

      - name: Checkout repository submodules
        env:
          # MobileGL upstream has exhausted its LFS quota, and its LFS files (tools/trace_replay/fixtures)
          # are irrelevant to the iOS build, so smudge is skipped to keep submodule checkout from failing with exit 128
          GIT_LFS_SKIP_SMUDGE: "1"
        run: git submodule update --init --recursive

      - name: Set up Apple code signing
        # Optional. Runs only when the signing secrets exist; without them the build
        # falls back to ldid, exactly as before. Proper signing is what keeps the
        # increased-memory-limit / extended-virtual-addressing entitlements alive -
        # re-signing with a profile that does not authorise them strips them out, which
        # is why sideloaded builds cannot map a large heap.
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          TEAMID: ${{ secrets.SIGNING_TEAMID }}
        run: |
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "signing=no" >> "$GITHUB_OUTPUT"
            echo "No signing secrets set - building unsigned (ldid)."
            exit 0
          fi
          RUNNER_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_KEYCHAIN"
          security set-keychain-settings -lut 3600 "$RUNNER_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          # A trailing newline pasted into the secret is the usual cause of
          # "MAC verification failed" - the runner would send "pw\n" and the check fails.
          CERT_PASSWORD=$(printf '%s' "$CERT_PASSWORD" | tr -d '\r\n')

          # Check the password against the bundle before importing, so a mismatch reports
          # which of the two secrets is wrong instead of a bare exit code.
          if ! openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys -passin pass:"$CERT_PASSWORD" -out /dev/null 2>/dev/null; then
            echo "::error::The .p12 and SIGNING_CERT_PASSWORD do not match. Either the password is wrong, or SIGNING_CERT_P12_BASE64 is from a different .p12 than the one you tested. Re-export and update BOTH secrets together."
            echo "Decoded .p12 size: $(wc -c < "$RUNNER_TEMP/cert.p12") bytes"
            exit 1
          fi
          echo "Password verified against the .p12"

          import_p12() {
            security import "$1" -k "$RUNNER_KEYCHAIN" \
              -P "$CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          }

          # OpenSSL 3.x - what Arch and most current Linux distros ship - defaults
          # "pkcs12 -export" to AES-256-CBC with a SHA-256 MAC. Apple's keychain
          # importer cannot read that scheme and reports it as "MAC verification
          # failed (wrong password?)", which is why the password check above can
          # pass while the import below still fails. /usr/bin/openssl on the runner
          # is LibreSSL, whose defaults are the SHA1/3DES scheme the keychain
          # expects, so a round trip through it converts the bundle in place and
          # no re-export is needed on the machine that created the .p12.
          if ! import_p12 "$RUNNER_TEMP/cert.p12"; then
            echo "Direct import failed - converting the bundle to the legacy PKCS#12 encryption Apple accepts."
            umask 077
            /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" \
              -passin pass:"$CERT_PASSWORD" -nodes -out "$RUNNER_TEMP/bundle.pem"
            /usr/bin/openssl pkcs12 -export -in "$RUNNER_TEMP/bundle.pem" \
              -passout pass:"$CERT_PASSWORD" -out "$RUNNER_TEMP/cert.legacy.p12" \
              -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 2>/dev/null \
              || /usr/bin/openssl pkcs12 -export -in "$RUNNER_TEMP/bundle.pem" \
                   -passout pass:"$CERT_PASSWORD" -out "$RUNNER_TEMP/cert.legacy.p12"
            rm -f "$RUNNER_TEMP/bundle.pem"
            import_p12 "$RUNNER_TEMP/cert.legacy.p12"
            rm -f "$RUNNER_TEMP/cert.legacy.p12"
            echo "Imported after conversion."
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$RUNNER_KEYCHAIN" login.keychain-db
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_KEYCHAIN" \
            | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No codesigning identity found in the imported .p12"
            exit 1
          fi
          echo "Signing identity resolved (${#IDENTITY} chars)"
          rm -f "$RUNNER_TEMP/cert.p12"
          {
            echo "signing=yes"
            echo "identity=$IDENTITY"
            echo "profile=$RUNNER_TEMP/profile.mobileprovision"
          } >> "$GITHUB_OUTPUT"

          # This repository is public, so its Actions logs are public too. The identity
          # reads "Apple Development: <Legal Name> (TEAMID)", and make prints it once per
          # signed binary - several hundred times a build. Register both with the runner
          # so they are redacted for the rest of the job, including make's output.
          # Masking last, after the outputs above are written, keeps it clear of them.
          echo "::add-mask::$IDENTITY"
          if [ -n "$TEAMID" ]; then echo "::add-mask::$TEAMID"; fi

      - name: Check CurseForge key wiring
        env:
          CONFIG_CURSEFORGE_API_KEY: ${{ secrets.CONFIG_CURSEFORGE_API_KEY }}
        run: |
          # Reports presence and length only - never the value itself.
          if [ -n "$CONFIG_CURSEFORGE_API_KEY" ]; then
            echo "CurseForge API key: present (${#CONFIG_CURSEFORGE_API_KEY} chars), will be compiled in"
          else
            echo "::warning::CurseForge API key not set - CurseForge will be unavailable in this build"
          fi

      - name: Build for ${{ matrix.platform_name }}
        env:
          IPHONEOS_DEPLOYMENT_TARGET: 14.0
          CONFIG_CURSEFORGE_API_KEY: ${{ secrets.CONFIG_CURSEFORGE_API_KEY }}
          # The Makefile declares TEAMID/SIGNING_TEAMID/PROVISIONING with ?=, so values
          # inherited from the environment win. Passing them here rather than on the
          # command line keeps the signing identity intact - it contains spaces and
          # would word-split as a make argument.
          SIGN_ENABLED: ${{ steps.signing.outputs.signing }}
          TEAMID: ${{ secrets.SIGNING_TEAMID }}
          SIGNING_TEAMID: ${{ steps.signing.outputs.identity }}
          PROVISIONING: ${{ steps.signing.outputs.profile }}
          # Optional. Set the BUNDLE_ID repository variable to a bundle id registered
          # under your own team; leaving it unset keeps the upstream default.
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
        run: |
          set -o pipefail
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=0

          if [ "$SIGN_ENABLED" = "yes" ]; then
            echo "Codesigning enabled for team $TEAMID"
          else
            # Clear the placeholders so the Makefile takes its unsigned ldid path.
            unset TEAMID SIGNING_TEAMID PROVISIONING
          fi
          # An empty BUNDLE_ID would override the Makefile default with a blank value.
          if [ -z "$BUNDLE_ID" ]; then
            unset BUNDLE_ID
          else
            echo "Bundle identifier: $BUNDLE_ID"
          fi

          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}

            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1

          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1

          else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
          fi

      - name: Check every on-screen string has English text
        if: success()
        run: |
          # localize()'s second argument is a comment, not a fallback: a key missing from
          # en.lproj reaches the screen as its own name. Nothing fails at build or launch,
          # which is how "download.progress.downloading" got in front of a user.
          python3 tools/check_localized_keys.py

      - name: Check every logging file can link the logging macro
        if: success()
        run: |
          # utils.h routes NSLog through customNSLog, which only the main executable
          # links. A file in another target that includes it compiles fine and fails at
          # link, a long way from the cause.
          python3 tools/check_log_macro_linkage.py

      - name: Check the loader version gates match what the loaders publish
        if: success()
        run: |
          # A compatibility check that says no is not a hint - the install screen refuses the tap -
          # so a gate that is too strict is a version nobody can install.
          python3 JavaApp/tools/check_loader_matrix.py

      - name: Check the launcher answers every LWJGL call Minecraft makes
        if: success()
        run: |
          # The frozen Flux API reference covers LWJGL 3.1.6 through 3.3.3 only.
          # It cannot be used as a 3.4.1 compatibility oracle because 3.4.1 itself
          # removed legacy APIs such as mallocStack/callocStack and old libffi helpers.
          #
          # For the Minecraft 26.x runtime, protect the exact failure we are fixing:
          # the built jar must preserve the LWJGL 3.4.1 Version.class imported from
          # the 3.4.1 core jar. This prevents a stale 3.3.3-snapshot class from winning
          # during jar assembly.
          jar=JavaApp/build/lwjgl-341.jar
          src=JavaApp/libs/lwjgl-341/lwjgl.jar
          if [ ! -f "$jar" ] || [ ! -f "$src" ]; then
            echo "::error::LWJGL 3.4.1 build/source jar missing"
            exit 1
          fi
          python3 - "$src" "$jar" <<'PY'
          import sys, zipfile
          src, built = sys.argv[1], sys.argv[2]
          entry = "org/lwjgl/Version.class"
          with zipfile.ZipFile(src) as source, zipfile.ZipFile(built) as output:
              if entry not in source.namelist() or entry not in output.namelist():
                  raise SystemExit(f"{entry} missing from source or built LWJGL 3.4.1 jar")
              if source.read(entry) != output.read(entry):
                  raise SystemExit("built lwjgl-341.jar does not preserve LWJGL 3.4.1 Version.class")
          print("LWJGL 3.4.1 Version.class preserved in built runtime.")
          PY
          echo "Checking LWJGL 3.4.1 ThreadLocalUtil JNI bridge"
          javap -p -classpath JavaApp/build/lwjgl-341.jar org.lwjgl.system.ThreadLocalUtil > "$RUNNER_TEMP/threadlocalutil.txt"
          if ! grep -q 'native long nsetupEnvData(int);' "$RUNNER_TEMP/threadlocalutil.txt"; then
            echo "::error::LWJGL 3.4.1 ThreadLocalUtil is not using the iOS nsetupEnvData JNI bridge"
            exit 1
          fi
          if grep -q 'native long setupEnvData(int);' "$RUNNER_TEMP/threadlocalutil.txt"; then
            echo "::error::stale desktop LWJGL 3.4.1 setupEnvData JNI symbol is still present"
            exit 1
          fi

          # Keep the historical cross-version audit for the legacy 3.3.3 runtime,
          # but do not let an older-version compatibility gap block the 26.x IPA.
          jar=JavaApp/build/lwjgl-333.jar
          if [ ! -f "$jar" ]; then
            echo "::warning::$jar not found - legacy LWJGL compatibility was not checked"
          else
            echo "Checking $jar (legacy/non-blocking)"
            if ! python3 JavaApp/tools/check_lwjgl_api.py "$jar"; then
              echo "::warning::LWJGL 3.3.3 legacy compatibility check has unanswered calls; this does not affect the Minecraft 26.x test build."
            fi
          fi

      - name: Confirm key was compiled in
        if: success()
        run: |
          # Presence check only. Never print config.h - it contains the key.
          if grep -q '^#define CONFIG_CURSEFORGE_API_KEY "' Natives/config.h 2>/dev/null; then
            echo "config.h: CurseForge key compiled in"
          else
            echo "::warning::config.h: no CurseForge key compiled in (app will fall back to a runtime key)"
          fi

      - name: Rename build output
        # The Makefile emits <bundle-id>-<ver>-<platform>.ipa. Rename to short,
        # readable names so the downloaded file is self-explanatory.
        if: success()
        run: |
          cd artifacts
          shopt -s nullglob
          # Bundle-id agnostic, but never pick up the SLIMMED build.
          ipa=( )
          for f in *-${{ matrix.platform_name }}.ipa; do case "$f" in *.slimmed-*) ;; *) ipa+=( "$f" );; esac; done
          tipa=( )
          for f in *-${{ matrix.platform_name }}-trollstore.tipa; do case "$f" in *.slimmed-*) ;; *) tipa+=( "$f" );; esac; done
          if [ ${#ipa[@]} -gt 0 ]; then mv "${ipa[0]}" flux.ipa; fi
          if [ ${#tipa[@]} -gt 0 ]; then mv "${tipa[0]}" flux.tipa; fi
          if [ ! -f flux.ipa ] && [ ! -f flux.tipa ]; then
            echo "::error::no installable package was produced"; exit 1
          fi
          ls -lh

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flux-${{ matrix.platform_name }}
          path: artifacts/flux.ipa

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flux-${{ matrix.platform_name }}-trollstore
          path: artifacts/flux.tipa

      - name: Upload debug symbols
        if: matrix.platform_name == 'ios' && success()
        uses: actions/upload-artifact@v4
        with:
          name: flux-${{ matrix.platform_name }}-dsym
          path: artifacts/Flux.dSYM
